
<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的個人網站</title>

    <style>
        /* 任務 1：修改整個網頁 */
        body {
            color: #333333;
            background-color: #f0f8ff;
        }

        /* 任務 2：修改主標題 */
        h1 {
            color: #2563a6;
            font-size: 36px;
            font-weight: bold;
            text-align: center;
        }

        /* 任務 3：建立 class */
        .notice {
            color: #ffffff;
            background-color: #4682b4;
            padding: 15px;
            border-radius: 10px;
        }

        /* 任務 4：自由增加 CSS */
        p {
            line-height: 1.8;
        }
    </style>
</head>

<body>

    <h1>11111111111</h1>

    <p class="notice">2222222222</p>

    <p>3333333333333</p>

</body>
</html>
